[project]
name = "ict-questions-ai"
version = "0.1.0"
description = "LLM service for question answering and generation using Ollama Cloud"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.11",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.28.1",
    "pydantic>=2.10.6",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]